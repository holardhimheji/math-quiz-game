<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maths quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>  
  <div class="container">
            <h1>Random Math Generator</h1>
            <p id="problem">Click the button to start </p>
            <div class="output-container" id="answers">
                <p id="message"></p>
                <div class="main">
                    <input type="number" placeholder="0"  id="answer-input"/>
                    <div class="btns">
                        <button class="btn1" id="submit">Submit</button>
                        <button class="btn2" id="next">Next</button>
                    </div>
                </div>
            </div>
            <button id="generateBtn">Generate New Problem</button>
        </div>
  
  <script src="script.js"></script>
  
</body>
</html>
